# ==========================================================
# Pizzaria — Docker Compose (Hostinger VPS)
#
#   frontend (nginx, SPA)  ─┐
#                           ├─ caddy (edge, 80/443, HTTPS automático)
#   backend  (FastAPI)     ─┘
#
# Base de dados: MongoDB Atlas (externo — configurado em backend/.env)
#
# Arrancar:   docker compose up -d --build
# Logs:       docker compose logs -f
# Atualizar:  git pull && docker compose up -d --build
# ==========================================================

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Vazio = mesma origem (Caddy encaminha /api). Não alterar salvo necessidade.
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
