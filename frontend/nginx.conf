# Servidor estático do SPA React.
# O encaminhamento de /api para o backend é feito pelo Caddy (edge).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash → cache longo e imutável
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rotas do SPA → sempre devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Não fazer cache do HTML (para apanhar novos deploys)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
